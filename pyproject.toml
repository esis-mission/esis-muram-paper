[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "esis-muram-paper"
authors = [
    {name = "Roy T. Smart", email = "roytsmart@gmail.com"},
]
description = "An AAS journal article comparing the explosive events of a MURaM simulation of the quiet Sun with those observed by the EUV Snapshot Imaging Spectrograph (ESIS)."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pylatex~=1.4",
    "aastex~=0.9.1",
    "matplotlib",
    "named-arrays~=2.18",
    "utu~=0.5",
    "fiasco",
    "scipy",
    "zarr>=3",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "pymupdf",
]
doc = [
    "pytest",
    "matplotlib",
    "graphviz",
    "sphinx-autodoc-typehints",
    "pydata-sphinx-theme",
    "ipykernel",
    "sphinx-favicon",
]

[project.urls]
Homepage = "https://github.com/esis-mission/esis-muram-paper"

[tool.setuptools.packages.find]
include = ["esis_muram_paper*"]

[tool.setuptools.package-data]
esis_muram_paper = ["*.bib"]

[tool.setuptools_scm]
